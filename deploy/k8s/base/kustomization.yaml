apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: distributed-market

labels:
  - pairs:
      app.kubernetes.io/part-of: distributed-market
    includeSelectors: false

resources:
  - namespace.yaml
  - configmap.yaml
  - engine.yaml
  - ledger.yaml
  - gateway.yaml
  - marketdata.yaml
  - ingress.yaml
  - networkpolicy.yaml
